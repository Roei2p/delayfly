<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%88%EF%B8%8F</text></svg>">
<title>FlightClaim Web</title>
<meta name="description" content="גרסת הדפדפן של FlightClaim — מחשבון פיצוי טיסה חינמי ומחולל מכתבי דרישה לפי חוק שירותי תעופה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A2540; --navy-dark:#051829; --blue:#0D47A1; --sky:#0284C7; --sky-light:#E0F2FE;
    --gold:#D97706; --gold-light:#FEF3C7; --gold-border:#FDE68A;
    --green:#059669; --green-light:#D1FAE5;
    --danger:#DC2626; --danger-light:#FEE2E2;
    --ink:#0F172A; --ink-soft:#1E293B; --ink-mid:#334155; --muted:#64748B; --line:#E2E8F0; --line-strong:#CBD5E1;
    --surface:#FFFFFF; --bg:#F7F9FC; --raised:#F1F5F9;
    --shadow: 0 16px 40px -18px rgba(10,37,64,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EEF3F9; --ink-soft:#CBD5E1; --ink-mid:#AAB9CC; --muted:#8CA0B8; --line:#1E3A5C; --line-strong:#28496e;
      --surface:#0E2237; --bg:#081627; --raised:#122c46;
      --sky-light:#12314d; --gold-light:#3a2a0c; --gold-border:#6b4d10; --green-light:#0c2c22; --danger-light:#3a1414;
      --shadow: 0 16px 40px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EEF3F9; --ink-soft:#CBD5E1; --ink-mid:#AAB9CC; --muted:#8CA0B8; --line:#1E3A5C; --line-strong:#28496e;
    --surface:#0E2237; --bg:#081627; --raised:#122c46;
    --sky-light:#12314d; --gold-light:#3a2a0c; --gold-border:#6b4d10; --green-light:#0c2c22; --danger-light:#3a1414;
    --shadow: 0 16px 40px -18px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Heebo',system-ui,sans-serif;
    direction:rtl; text-align:right;
    display:flex; justify-content:center;
  }
  h1,h2,h3,.brand{ font-family:'Rubik','Heebo',system-ui,sans-serif; }
  h1,h2,h3{ margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }

  #shell{ width:100%; max-width:460px; min-height:100%; background:var(--bg); display:flex; flex-direction:column; position:relative; }

  /* top bar */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--line); padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .topbar .id{ display:flex; align-items:center; gap:10px; }
  .topbar .id img{ width:34px; height:34px; border-radius:9px; }
  .topbar .id .t{ font-weight:800; font-size:15px; color:var(--navy); }
  :root[data-theme="dark"] .topbar .id .t, @media (prefers-color-scheme:dark){ .topbar .id .t{ color:var(--ink); } }
  .topbar .id .s{ font-size:10.5px; color:var(--muted); }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:none; background:transparent; color:var(--navy);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;
  }
  .icon-btn:active{ background:var(--raised); }

  /* scroll area */
  .screen{ flex:1; overflow-y:auto; padding:14px 14px 100px; }
  .screen::-webkit-scrollbar{ display:none; }

  /* cards */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
  .card.tight{ padding:14px; }
  .card-title{ font-weight:700; font-size:14.5px; color:var(--navy); }
  :root[data-theme="dark"] .card-title, @media (prefers-color-scheme:dark){ .card-title{ color:var(--ink); } }
  .card-sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row.top{ align-items:flex-start; }

  .field{ margin-top:10px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; border:1.5px solid var(--line-strong); border-radius:11px; padding:11px 12px;
    font-size:13.5px; background:var(--surface); color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--blue); }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:13px; border:1.5px solid transparent;
    cursor:pointer; text-decoration:none; white-space:nowrap; transition:transform .1s, opacity .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-block{ width:100%; }
  .btn-primary{ background:linear-gradient(135deg,var(--blue),var(--sky)); color:#fff; box-shadow:0 10px 22px -10px rgba(13,71,161,.55); }
  .btn-outline{ background:transparent; border-color:var(--blue); color:var(--blue); }
  .btn-ghost{ background:var(--raised); border-color:var(--line); color:var(--ink-mid); }
  .btn-sm{ padding:9px 14px; font-size:12px; border-radius:10px; }
  .btn[disabled]{ opacity:.5; pointer-events:none; }

  .chip{
    display:inline-flex; align-items:center; padding:7px 13px; border-radius:20px; font-size:11.5px; font-weight:600;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-mid); cursor:pointer; white-space:nowrap;
  }
  .chip.selected{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-top:6px; }
  .chip-row::-webkit-scrollbar{ display:none; }

  .pill{ flex:1; text-align:center; padding:11px 4px; border-radius:11px; font-size:12px; font-weight:600; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-mid); cursor:pointer; }
  .pill.selected{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .pill-row{ display:flex; gap:6px; }

  .badge{ display:inline-flex; padding:4px 10px; border-radius:8px; font-size:10.5px; font-weight:700; }

  /* hero alert */
  .alert-card{ background:linear-gradient(150deg,var(--navy),var(--navy-dark)); border-radius:18px; padding:16px; margin-bottom:14px; color:#fff; }
  .alert-card .live{ display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px; }
  .blip{ width:8px; height:8px; border-radius:50%; background:var(--gold); animation:blip 1.6s ease-in-out infinite; }
  @keyframes blip{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .alert-card .delay-badge{ background:var(--gold); color:var(--navy-dark); font-weight:800; font-size:11px; padding:3px 9px; border-radius:8px; }
  .alert-card p{ color:var(--sky-light); font-size:12.5px; line-height:1.55; margin-top:8px; }
  .alert-actions{ display:flex; gap:8px; margin-top:12px; }
  .alert-actions .a{ flex:1; background:rgba(255,255,255,.08); border-radius:10px; padding:9px; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:#fff; cursor:pointer; border:none; }

  /* free banner */
  .free-banner{ background:var(--sky-light); border:1.5px solid color-mix(in srgb, var(--sky) 35%, transparent); border-radius:16px; padding:13px; margin-bottom:14px; display:flex; gap:11px; }
  .free-banner .ic{ flex:none; width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--sky)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
  .free-banner b{ font-size:13px; }
  .free-banner p{ font-size:11.5px; color:var(--ink-mid); margin-top:2px; line-height:1.5; }

  /* rights list */
  .right-item{ display:flex; gap:10px; align-items:flex-start; padding:6px 0; }
  .right-item .dot{ flex:none; width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .right-item .t{ font-weight:700; font-size:12.5px; }
  .right-item .d{ font-size:11px; color:var(--muted); line-height:1.5; margin-top:1px; }

  /* compensation card */
  .comp-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:13px; color:var(--ink-mid); }
  .comp-row b{ color:var(--ink); font-family:'Rubik',sans-serif; font-variant-numeric:tabular-nums; }
  .comp-total{ margin-top:10px; background:var(--green-light); border:1px solid color-mix(in srgb, var(--green) 30%, transparent); border-radius:14px; padding:13px; display:flex; justify-content:space-between; align-items:center; }
  .comp-total span{ font-size:12px; color:var(--ink-mid); }
  .comp-total b{ font-size:21px; color:var(--green); font-family:'Rubik',sans-serif; font-variant-numeric:tabular-nums; }

  /* timeline */
  .timeline{ display:flex; justify-content:space-between; margin-top:10px; }
  .tl-step{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .tl-step .c{ width:26px; height:26px; border-radius:50%; background:var(--line-strong); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .tl-step .c.done{ background:var(--green); }
  .tl-step .c.current{ background:var(--blue); }
  .tl-step .l{ font-size:8.5px; color:var(--muted); margin-top:4px; line-height:1.3; }
  .tl-step .l.current{ color:var(--blue); font-weight:700; }

  /* bottom nav */
  .bottomnav{
    position:sticky; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .navitem{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; border:none; background:none; cursor:pointer; color:var(--muted); }
  .navitem .ic{ font-size:19px; }
  .navitem .l{ font-size:10px; font-weight:600; }
  .navitem.active{ color:var(--blue); }

  /* claim list */
  .claim-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:12px; cursor:pointer; }
  .claim-card:active{ background:var(--raised); }
  .claim-head{ display:flex; align-items:center; gap:9px; }
  .claim-head .ic{ width:34px; height:34px; border-radius:9px; background:var(--sky-light); color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .claim-head .t{ font-weight:700; font-size:14px; }
  .claim-head .s{ font-size:11px; color:var(--muted); }
  .claim-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .claim-foot .l{ font-size:11px; color:var(--muted); }
  .claim-foot .amt{ font-size:16px; font-weight:800; color:var(--green); font-family:'Rubik',sans-serif; }

  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .ic{ width:64px; height:64px; border-radius:50%; background:var(--sky-light); color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:14px; }
  .empty b{ color:var(--ink); font-size:15px; }
  .empty p{ font-size:12.5px; margin-top:6px; max-width:26ch; }

  /* letter box */
  .letter-box{ background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:13px; font-family:'Courier New',monospace; font-size:11.5px; line-height:1.65; color:var(--ink-mid); white-space:pre-wrap; max-height:340px; overflow-y:auto; }

  /* guide */
  .guide-hero{ background:linear-gradient(150deg,var(--navy),var(--navy-dark)); border-radius:18px; padding:16px; color:#fff; margin-bottom:14px; }
  .guide-hero p{ color:var(--sky-light); font-size:12.5px; margin-top:6px; line-height:1.55; }
  .guide-item{ display:flex; gap:8px; padding:4px 0; font-size:12px; color:var(--ink-mid); line-height:1.55; }
  .guide-item .b{ color:var(--blue); font-weight:800; }

  /* dialog */
  .overlay{ position:fixed; inset:0; background:rgba(5,10,20,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.center{ align-items:center; padding:20px; }
  .sheet{ width:100%; max-width:460px; background:var(--surface); border-radius:22px 22px 0 0; padding:20px; max-height:85vh; overflow-y:auto; }
  .overlay.center .sheet{ border-radius:20px; max-width:340px; }
  .sheet h3{ font-size:16px; font-weight:800; color:var(--navy); margin-bottom:6px; }
  :root[data-theme="dark"] .sheet h3, @media (prefers-color-scheme:dark){ .sheet h3{ color:var(--ink); } }
  .sheet p.d{ font-size:12.5px; color:var(--ink-mid); line-height:1.6; margin-bottom:14px; }
  .sheet .actions{ display:flex; gap:10px; margin-top:16px; }
  .sheet .actions .btn{ flex:1; }

  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:12.5px; z-index:60; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; }
  .toast.show{ opacity:1; }

  .photo-preview{ position:relative; width:100%; height:120px; border-radius:12px; overflow:hidden; background:var(--raised); margin-top:10px; }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .photo-preview button{ position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.85); border:none; color:var(--danger); font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div dir="rtl" lang="he" id="shell"></div>
<div id="overlays"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- data / domain logic (ported from the Android app) ---------------- */

  var DISTANCE = {
    SHORT:  { label: "עד 2,000 ק\"מ (לרנקה, אתונה, כרתים)", nis: 1510 },
    MEDIUM: { label: "2,000 עד 4,500 ק\"מ (אירופה, רומא, פריז, לונדון)", nis: 2420 },
    LONG:   { label: "מעל 4,500 ק\"מ (ניו יורק, מיאמי, המזרח הרחוק)", nis: 3620 }
  };

  var STATUS_STEPS = [
    { key: "SUBMITTED", label: "הגשת תביעה" },
    { key: "LEGAL_NOTICE_SENT", label: "מכתב התראה" },
    { key: "AIRLINE_REVIEW", label: "בדיקת חברת תעופה" },
    { key: "APPROVED", label: "אישור פיצוי" },
    { key: "PAID", label: "העברת כספים" }
  ];
  var STATUS_TITLE = {
    SUBMITTED: "תביעה הוגשה במערכת",
    LEGAL_NOTICE_SENT: "נשלח מכתב דרישה רשמי",
    AIRLINE_REVIEW: "בבדיקה משפטית מול חברת התעופה",
    APPROVED: "הפיצוי אושר לתשלום",
    PAID: "הכספים הועברו לחשבונך"
  };

  function calcCompensation(delayHours, distanceKey, isCancelled, terminalExpenses){
    var dist = DISTANCE[distanceKey];
    var statutoryEligible = isCancelled || delayHours >= 8;
    var baseGross;
    if (statutoryEligible) baseGross = dist.nis;
    else if (delayHours >= 5) baseGross = Math.floor(dist.nis * 0.75);
    else if (delayHours >= 3) baseGross = 1510;
    else baseGross = dist.nis;

    var totalEntitlement = baseGross + terminalExpenses;

    var rights = [
      { title: "מזון ומשקאות (הזכות פעילה מעיכוב של שעתיים)",
        desc: "חברת התעופה מחויבת לספק שוברים לארוחות ושתייה בטרמינל 3/1, או להחזיר את מלוא הסכום מכל קבלה שתשמור.",
        active: delayHours >= 2 },
      { title: "שירותי תקשורת (2 שיחות ודוא\"ל)",
        desc: "זכאות לשתי שיחות טלפון ומשלוח הודעה אלקטרונית/פקס ללא תשלום.",
        active: delayHours >= 2 },
      { title: "השבת תמורה מלאה או טיסה חלופית (עיכוב של 5+ שעות)",
        desc: "באפשרותך לבחור לבטל את הטיסה ולקבל החזר מלא של כרטיס הטיסה תוך 21 יום, או טיסה חלופית במועד הנוח לך.",
        active: delayHours >= 5 },
      { title: "אירוח במלון והסעה (בשהיית לילה)",
        desc: "אם נדרשת שהייה של לילה בנתב\"ג, חברת התעופה חייבת לממן מלון והסעה הלוך ושוב.",
        active: delayHours >= 5 },
      { title: "פיצוי כספי סטטוטורי ללא הוכחת נזק (8+ שעות או ביטול)",
        desc: "זכאות לפיצוי כספי ישיר של " + dist.nis + " ₪ לפי מרחק הטיסה, על פי חוק שירותי תעופה.",
        active: delayHours >= 8 || isCancelled }
    ];

    var headline;
    if (isCancelled) headline = "טיסה מבוטלת: זכאות לפיצוי כספי מלא של " + dist.nis + " ₪";
    else if (delayHours >= 8) headline = "עיכוב של 8+ שעות: זכאות לפיצוי סטטוטורי של " + dist.nis + " ₪";
    else if (delayHours >= 5) headline = "עיכוב של " + Math.trunc(delayHours) + " שעות: זכאות להשבת כרטיס, מזון ומלון";
    else headline = "עיכוב של שעתיים בנתב\"ג: זכאות לשוברים, מזון והגשת תביעה מקדימה";

    return { statutoryNis: baseGross, totalEntitlement: totalEntitlement, rights: rights, headline: headline };
  }

  function generateLetter(claim){
    var today = new Date().toLocaleDateString("he-IL");
    var cancellationClause = claim.isCancelled
      ? "ביטול טיסה ללא מתן הודעה מוקדמת כדין, בניגוד לסעיף 6 לחוק שירותי תעופה."
      : "עיכוב חריג של כ-" + claim.delayHours + " שעות בהמראת הטיסה מנמל התעופה בן גוריון (TLV) ליעד " + claim.destinationAirport + ", כאשר עיכוב העולה על 8 שעות מהווה ביטול טיסה סטטוטורי לפי סעיף 6(א) לחוק, ולמצער עולה על שעתיים ומקים חובת סיוע מידית במזון ושתייה.";
    var expensesClause = claim.terminalExpensesNis > 0
      ? "\nבנוסף, מרשי/ה נאלץ/ה לשאת בהוצאות מזון ושתייה בנמל התעופה על סך " + claim.terminalExpensesNis + " ₪, משום שלא הוענקו שוברים כנדרש. קבלות מצורפות לפנייה זו."
      : "";

    return "תאריך: " + today + "\n" +
"לכבוד:\n" +
"מחלקת פניות הציבור והמחלקה המשפטית\n" +
"חברת התעופה: " + claim.airlineName + "\n\n" +
"הנדון: התראה לפני נקיטת הליכים משפטיים ודרישת פיצוי סטטוטורי\n" +
"לפי חוק שירותי תעופה (פיצוי וסיוע בשל ביטול טיסה או שינוי בתנאיה), תשע\"ב-2012\n\n" +
"פרטי הנוסע/ת:\n" +
"שם מלא: " + claim.passengerName + "\n" +
"טלפון: " + claim.passengerPhone + "\n" +
"דוא\"ל: " + claim.passengerEmail + "\n" +
"מספר הזמנה (PNR): " + claim.bookingReference + "\n" +
"מספר טיסה: " + claim.flightNumber + "\n" +
"תאריך הטיסה: " + claim.flightDate + "\n" +
"מסלול: " + claim.departureAirport + " אל " + claim.destinationAirport + "\n\n" +
"מבוא ועובדות המקרה:\n" +

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function nl2br(s){ return esc(s).replace(/\n/g, "<br>"); }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function render(){
    var body = "";
    if (state.selectedClaimId != null) {
      body = renderClaimDetail(getClaim(state.selectedClaimId));
    } else if (state.tab === "home") {
      body = renderHome();
    } else if (state.tab === "claims") {
      body = renderClaimsList();
    } else {
      body = renderGuide();
    }

    var showTopBar = state.selectedClaimId == null;
    var showNav = state.selectedClaimId == null;

    shell.innerHTML =
      (showTopBar ? renderTopBar() : "") +
      '<div class="screen" id="screen">' + body + '</div>' +
      (showNav ? renderBottomNav() : "");

    wireEvents();
  }

  function renderTopBar(){
    var titles = {
      home: ["פיצוי טיסה בנתב\"ג", "תביעות לפי חוק שירותי תעופה (חוק טיבי)"],
      claims: ["מעקב תביעות (" + claims.length + ")", ""],
      guide: ["מדריך זכויות נוסע בנתב\"ג", ""]
    };
    var t = titles[state.tab];
    return '<div class="topbar">' +
      '<div class="id"><img src="data:image/jpeg;base64,' + ICON_B64 + '" alt=""><div><div class="t">' + esc(t[0]) + '</div>' + (t[1] ? '<div class="s">' + esc(t[1]) + '</div>' : '') + '</div></div>' +
      (state.tab === "home" ? '<button class="icon-btn" data-act="go-guide" title="מדריך זכויות">❓</button>' : '') +
      '</div>';
  }

  function renderBottomNav(){
    function item(key, icon, label){
      return '<button class="navitem' + (state.tab === key ? ' active' : '') + '" data-tab="' + key + '"><span class="ic">' + icon + '</span><span class="l">' + label + '</span></button>';
    }
    return '<div class="bottomnav">' +
      item("home", "✈️", "עיכוב בנתב\"ג") +
      item("claims", "📋", "התביעות שלי") +
      item("guide", "⚖️", "זכויות בחוק") +
      '</div>';
  }

  function renderFreeBanner(){
    return '<div class="free-banner"><div class="ic">✔</div><div><b>כלי חינמי לחלוטין</b>' +
      '<p>התחשיב והמכתב המשפטי מיועדים לשימושך העצמאי, ללא עלות וללא הרשמה. אתה זה ששולח ומנהל את הפנייה מול חברת התעופה.</p></div></div>';
  }

  function renderHome(){
    var calc = calcCompensation(draft.delayHours, draft.distanceCategory, draft.isCancelled, draft.terminalExpensesNis);
    var activeRights = calc.rights.filter(function(r){ return r.active; });

    var presets = [
      { label: "אל על LY001 ניו יורק", num: "LY001", airline: "אל על (El Al)", dest: "ניו יורק (JFK)", dist: "LONG" },
      { label: "Wizz W6 2325 בודפשט", num: "W6 2325", airline: "Wizz Air", dest: "בודפשט (BUD)", dist: "MEDIUM" },
      { label: "Ryanair FR4022 רומא", num: "FR4022", airline: "Ryanair", dest: "רומא (FCO)", dist: "MEDIUM" },
      { label: "ארקיע IZ821 אתונה", num: "IZ821", airline: "ארקיע (Arkia)", dest: "אתונה (ATH)", dist: "SHORT" }
    ];

    var delayLabel = draft.isCancelled ? "טיסה בוטלה!" : (Math.trunc(draft.delayHours) + " שעות עיכוב");

    return '' +
      '<div class="alert-card">' +
        '<div class="row"><span class="live"><span class="blip"></span> נתב"ג (TLV) • מצב עיכוב חי</span><span class="delay-badge">עיכוב של ' + Math.trunc(draft.delayHours) + ' שעות</span></div>' +
        '<p>טיסה ' + esc(draft.flightNumber) + ' מתעכבת כעת. החוק מעניק לך זכויות מזון ושתייה מידיות בטרמינל, וזכאות לפיצוי של אלפי שקלים בהמשך!</p>' +
        '<div class="alert-actions">' +
          '<button class="a" data-act="open-expense">🍔 שמור קבלות אוכל</button>' +
          '<button class="a" data-tab="guide">📜 מדריך זכויות מלא</button>' +
        '</div>' +
      '</div>' +

      renderFreeBanner() +

      '<div class="card">' +

  function pillHtml(val, label, selected){
    return '<button class="pill' + (selected ? ' selected' : '') + '" data-act="set-delay" data-val="' + val + '">' + label + '</button>';

  function renderClaimsList(){
    if (!claims.length) {
      return '<div class="empty"><div class="ic">📄</div><b>אין עדיין תביעות פעילות</b><p>העלה את פרטי הטיסה והעיכוב במסך הראשי כדי להפיק מכתב דרישה לחברת התעופה!</p>' +
        '<button class="btn btn-primary" style="margin-top:16px;" data-tab="home">הגש תביעה ראשונה</button></div>';
    }
    var sorted = claims.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    return sorted.map(function(c){
      var statusBg = (c.status === "PAID" || c.status === "APPROVED") ? "var(--green-light)" : (c.status === "AIRLINE_REVIEW" ? "var(--gold-light)" : "var(--sky-light)");
      var statusColor = (c.status === "PAID" || c.status === "APPROVED") ? "var(--green)" : (c.status === "AIRLINE_REVIEW" ? "var(--gold)" : "var(--blue)");
      return '<div class="claim-card" data-act="open-claim" data-id="' + c.id + '">' +
        '<div class="claim-head"><div class="ic">✈</div><div style="flex:1;"><div class="t">' + esc(c.flightNumber) + ' • ' + esc(c.airlineName) + '</div><div class="s">' + esc(c.departureAirport) + ' ➔ ' + esc(c.destinationAirport) + '</div></div>' +
        '<span class="badge" style="background:' + statusBg + ';color:' + statusColor + ';">' + STATUS_TITLE[c.status] + '</span></div>' +
        '<div class="claim-foot"><div><div class="l">עיכוב: ' + Math.trunc(c.delayHours) + ' שעות (' + esc(c.flightDate) + ')</div><div class="l">פיצוי סטטוטורי: ' + c.grossCompensationNis + ' ₪</div></div>' +
        '<div style="text-align:left;"><div class="l">סה"כ המגיע לך:</div><div class="amt">' + c.totalPayoutNis + ' ₪</div></div></div>' +
        renderTimeline(c.status) +
      '</div>';
    }).join('');
  }

  function renderTimeline(status){
    var currentIdx = STATUS_STEPS.findIndex(function(s){ return s.key === status; });
    return '<div class="timeline">' + STATUS_STEPS.map(function(s, i){
      var done = i < currentIdx, current = i === currentIdx;
      return '<div class="tl-step"><div class="c' + (done ? ' done' : current ? ' current' : '') + '">' + (done ? '✓' : (i+1)) + '</div><div class="l' + (current ? ' current' : '') + '">' + s.label + '</div></div>';
    }).join('') + '</div>';
  }

  function getClaim(id){ return claims.find(function(c){ return c.id === id; }); }

  function renderClaimDetail(c){
    if (!c) { state.selectedClaimId = null; return renderClaimsList(); }
    var statusBg = (c.status === "PAID" || c.status === "APPROVED") ? "var(--green-light)" : (c.status === "AIRLINE_REVIEW" ? "var(--gold-light)" : "var(--sky-light)");
    var statusColor = (c.status === "PAID" || c.status === "APPROVED") ? "var(--green)" : (c.status === "AIRLINE_REVIEW" ? "var(--gold)" : "var(--blue)");
    return '' +
      '<div class="topbar" style="margin:-14px -14px 14px;"><button class="icon-btn" data-act="back">→</button>' +
      '<div class="id"><div class="t">תביעה: ' + esc(c.flightNumber) + ' (' + esc(c.airlineName) + ')</div></div>' +
      '<button class="icon-btn" data-act="share-letter" data-id="' + c.id + '">↗</button></div>' +

        '<div class="row"><div><div class="card-title" style="font-size:16px;">' + esc(c.flightNumber) + ' • ' + esc(c.airlineName) + '</div><div class="card-sub">' + esc(c.departureAirport) + ' ➔ ' + esc(c.destinationAirport) + '</div></div>' +

        '<div class="card-title" style="font-size:13px;">תחשיב כספי לפי חוק שירותי תעופה</div>' +
        '<div class="comp-row"><span>פיצוי סטטוטורי מלא:</span><b>' + c.grossCompensationNis + ' ₪</b></div>' +
        (c.terminalExpensesNis > 0 ? '<div class="comp-row"><span>קבלות בנתב"ג (100% החזר מלא אליך):</span><b style="color:var(--green);">+' + c.terminalExpensesNis + ' ₪</b></div>' : '') +
        '<hr style="border:none;border-top:1px solid rgba(5,150,105,.25);margin:10px 0;">' +
        '<div class="row"><b style="font-size:14px;">סה"כ המגיע לך מהחברה:</b><b style="font-size:21px;color:var(--green);font-family:\'Rubik\',sans-serif;">' + c.totalPayoutNis + ' ₪</b></div>' +
      '</div>' +

      renderFreeBanner() +

      '<button class="btn btn-outline btn-block" data-act="open-expense-detail" data-id="' + c.id + '">➕ הוסף קבלה על קפה / ארוחה בטרמינל (' + c.terminalExpensesNis + ' ₪ כעת)</button>' +

        '<button class="btn btn-primary btn-sm" data-act="copy-letter" data-id="' + c.id + '">📋 העתק</button></div>' +
        '<div class="letter-box" style="margin-top:12px;">' + nl2br(c.legalDemandLetter) + '</div>' +
      '</div>' +

      '<div class="card" style="background:var(--raised);">' +
        '<div class="card-title" style="font-size:13px;">עדכון סטטוס התביעה מול חברת התעופה:</div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;">' +
          '<button class="btn btn-outline btn-sm" style="flex:1;" data-act="set-status" data-id="' + c.id + '" data-status="AIRLINE_REVIEW">בדיקת חברה</button>' +
          '<button class="btn btn-outline btn-sm" style="flex:1;" data-act="set-status" data-id="' + c.id + '" data-status="APPROVED">אושר פיצוי</button>' +
          '<button class="btn btn-outline btn-sm" style="flex:1;" data-act="set-status" data-id="' + c.id + '" data-status="PAID">הועברו כספים</button>' +
        '</div>' +
      '</div>';
  }

      renderFreeBanner() +
      section("עיכוב של שעתיים (המצב שלך כעת)", "פעיל כעת", "var(--gold)", [
        "מזון ומשקאות: חברת התעופה מחויבת להעניק לך שוברים לארוחות ושתייה בטרמינל 3 או טרמינל 1.",

        "פיצויים לדוגמה: בית המשפט רשאי לפסוק עד 11,870 ₪ נוספים אם החברה סירבה לספק סיוע בזדון."

      '<div class="card"><div class="card-title">איפה מוצאים נציגים בנתב"ג?</div>' +
      '<p style="font-size:12.5px;color:var(--ink-mid);line-height:1.6;margin-top:8px;">• טרמינל 3 (דיוטי פרי והשרוולים): דלפקי שירות הלקוחות של אל על, לאופר, QAS ממוקמים ברוטונדה המרכזית וליד שער היציאה (Gate).<br>• דרוש שובר מזון ישירות מהדיילים בשער!<br>• צלם את לוח הטיסות (FIDS) המציג את העיכוב.</p></div>';
  }

  /* ---------------- overlays (dialogs) ---------------- */

  function openExpenseDialog(claimId){
    overlays.innerHTML = '<div class="overlay"><div class="sheet">' +
      '<h3>הוספת הוצאה / קבלה בנתב"ג</h3>' +
      '<p class="d">חוק שירותי תעופה מחייב את חברת התעופה לספק מזון ושתייה לאחר שעתיים עיכוב. אם לא חילקו שוברים, שמור את הקבלה וחברת התעופה תחזיר את מלוא הסכום.</p>' +
      '<div class="field"><label>סכום בש"ח (למשל 85)</label><input type="number" id="exp-amt" inputmode="numeric"></div>' +
      '<div class="field"><label>תיאור (למשל: קפה וכריך בארומה טרמינל 3)</label><input type="text" id="exp-desc"></div>' +
      '<div class="actions"><button class="btn btn-ghost" data-act="close-overlay">ביטול</button><button class="btn btn-primary" data-act="confirm-expense" data-id="' + (claimId||'') + '">הוסף</button></div>' +
      '</div></div>';
    wireOverlayEvents();
  }

  function openSuccessDialog(claimId){
    overlays.innerHTML = '<div class="overlay center"><div class="sheet" style="text-align:center;">' +
      '<div style="font-size:36px;">✅</div>' +
      '<h3 style="margin-top:10px;">התביעה הוגשה בהצלחה!</h3>' +
      '<p class="d" style="text-align:right;">מכתב התראה רשמי הופק בהתאם לחוק שירותי תעופה (חוק טיבי).<br><br><b style="color:var(--blue);">הכלי חינמי לחלוטין:</b> העתק את המכתב ושלח אותו בעצמך לחברת התעופה, ועקוב אחר הסטטוס במסך "התביעות שלי".</p>' +
      '<button class="btn btn-primary btn-block" data-act="view-claim" data-id="' + claimId + '">צפה בפרטי התביעה ובמכתב</button>' +
      '</div></div>';
    wireOverlayEvents();
  }

  function closeOverlay(){ overlays.innerHTML = ""; }

  function wireOverlayEvents(){
    overlays.querySelectorAll("[data-act]").forEach(function(el){
      el.addEventListener("click", function(){
        var act = el.getAttribute("data-act");
        if (act === "close-overlay") { closeOverlay(); }
        else if (act === "confirm-expense") {
          var amt = parseInt(document.getElementById("exp-amt").value, 10) || 0;
          var id = el.getAttribute("data-id");
          if (amt > 0) {
            if (id) {
              var c = getClaim(parseInt(id,10));
              if (c) { c.terminalExpensesNis += amt; c.totalPayoutNis = c.grossCompensationNis + c.terminalExpensesNis; saveClaims(claims); }
            } else {
              draft.terminalExpensesNis += amt;
            }
          }
          closeOverlay();
          render();
        }
        else if (act === "view-claim") {
          state.selectedClaimId = parseInt(el.getAttribute("data-id"), 10);
          state.tab = "claims";
          closeOverlay();
          render();
        }
      });
    });
  }

  /* ---------------- event wiring ---------------- */

  function wireEvents(){
    shell.querySelectorAll("[data-tab]").forEach(function(el){
      el.addEventListener("click", function(){
        state.tab = el.getAttribute("data-tab");
        state.selectedClaimId = null;
        render();
      });
    });

    shell.querySelectorAll("[data-act]").forEach(function(el){
      el.addEventListener("click", function(ev){
        var act = el.getAttribute("data-act");
        if (act === "go-guide") { state.tab = "guide"; render(); }
        else if (act === "open-expense") { openExpenseDialog(null); }
        else if (act === "toggle-cancelled") { draft.isCancelled = !draft.isCancelled; render(); }
        else if (act === "set-delay") { draft.isCancelled = false; draft.delayHours = parseFloat(el.getAttribute("data-val")); render(); }
        else if (act === "preset") {
          draft.flightNumber = el.getAttribute("data-num");
          draft.airlineName = el.getAttribute("data-airline");
          draft.destinationAirport = el.getAttribute("data-dest");
          draft.distanceCategory = el.getAttribute("data-dist");
          render();
        }
        else if (act === "remove-photo") { draft.ticketImageDataUrl = null; render(); }
        else if (act === "back") { state.selectedClaimId = null; render(); }
        else if (act === "open-claim") { state.selectedClaimId = parseInt(el.getAttribute("data-id"), 10); render(); }
        else if (act === "open-expense-detail") { openExpenseDialog(el.getAttribute("data-id")); }
        else if (act === "copy-letter" || act === "share-letter") {
          var c = getClaim(parseInt(el.getAttribute("data-id"), 10));
          if (c) {
            var text = c.legalDemandLetter;
            if (act === "share-letter" && navigator.share) {
              navigator.share({ text: text }).catch(function(){});
            } else if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(function(){ toast("המכתב הועתק ללוח!"); }).catch(function(){ toast("לא ניתן להעתיק אוטומטית"); });
            } else { toast("לא ניתן להעתיק אוטומטית"); }
          }
        }
        else if (act === "set-status") {
          var cc = getClaim(parseInt(el.getAttribute("data-id"), 10));
          if (cc) { cc.status = el.getAttribute("data-status"); saveClaims(claims); render(); }
        }
        else if (act === "submit") { submitClaim(); }
      });
    });

    var nameEl = document.getElementById("f-name");
    if (nameEl) nameEl.addEventListener("input", function(){ draft.passengerName = nameEl.value; });
    var phoneEl = document.getElementById("f-phone");
    if (phoneEl) phoneEl.addEventListener("input", function(){ draft.passengerPhone = phoneEl.value; });
    var emailEl = document.getElementById("f-email");
    if (emailEl) emailEl.addEventListener("input", function(){ draft.passengerEmail = emailEl.value; });
    var fnEl = document.getElementById("f-flightnum");
    if (fnEl) fnEl.addEventListener("input", function(){ draft.flightNumber = fnEl.value; });
    var alEl = document.getElementById("f-airline");
    if (alEl) alEl.addEventListener("input", function(){ draft.airlineName = alEl.value; });
    var destEl = document.getElementById("f-dest");
    if (destEl) destEl.addEventListener("input", function(){ draft.destinationAirport = destEl.value; });
    var pnrEl = document.getElementById("f-pnr");
    if (pnrEl) pnrEl.addEventListener("input", function(){ draft.bookingReference = pnrEl.value; });
    var sliderEl = document.getElementById("f-slider");
    if (sliderEl) sliderEl.addEventListener("input", function(){ draft.delayHours = parseFloat(sliderEl.value); renderSliderOnly(); });
    var photoEl = document.getElementById("f-photo");
    if (photoEl) photoEl.addEventListener("change", function(){
      var file = photoEl.files && photoEl.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e){ draft.ticketImageDataUrl = e.target.result; render(); };
      reader.readAsDataURL(file);
    });
  }

  function renderSliderOnly(){
    // Cheap live-update while dragging: re-render whole screen (state is small, fine for this app's scale)
    render();
    var s = document.getElementById("f-slider");
    if (s) s.focus();
  }

  function submitClaim(){
    var calc = calcCompensation(draft.delayHours, draft.distanceCategory, draft.isCancelled, draft.terminalExpensesNis);
    var claim = {
      id: Date.now(),
      passengerName: draft.passengerName || "נוסע בנתב\"ג",
      passengerPhone: draft.passengerPhone || "054-0000000",
      passengerEmail: draft.passengerEmail || "passenger@natbag.co.il",
      bookingReference: draft.bookingReference || "TL7799",
      flightNumber: draft.flightNumber || "LY001",
      airlineName: draft.airlineName || "חברת תעופה",
      departureAirport: draft.departureAirport,
      destinationAirport: draft.destinationAirport || "יעד בחו\"ל",
      flightDate: draft.flightDate,
      delayHours: draft.delayHours,
      isCancelled: draft.isCancelled,
      distanceCategory: draft.distanceCategory,
      grossCompensationNis: calc.statutoryNis,
      terminalExpensesNis: draft.terminalExpensesNis,
      totalPayoutNis: calc.totalEntitlement,
      status: "LEGAL_NOTICE_SENT",
      createdAt: Date.now(),
      legalDemandLetter: ""
    };
    claim.legalDemandLetter = generateLetter(claim);
    claims.push(claim);
    saveClaims(claims);
    openSuccessDialog(claim.id);
  }

  render();
})();
</script>

</body>
</html>
